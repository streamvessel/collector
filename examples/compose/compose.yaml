# sv-log-agent next to an nginx container. The secret is passed as a file
# (recommended: rotation needs no restart and it stays out of docker inspect):
#
#   printf '%s' 'svas_…' > sv_client_secret.txt && chmod 600 sv_client_secret.txt
#   SV_CLIENT_ID=sva_… docker compose up -d
services:
  nginx:
    image: nginx:1.29
    volumes:
      - nginx-logs:/var/log/nginx
    # The official image links access.log to stdout; write a real file instead.
    command: ["/bin/sh", "-c", "rm -f /var/log/nginx/access.log /var/log/nginx/error.log && exec nginx -g 'daemon off;'"]
    ports: ["8080:80"]

  sv-log-agent:
    image: ghcr.io/streamvessel/sv-log-agent:latest
    restart: unless-stopped
    user: "0"   # read logs written by another container's user
    environment:
      SV_SERVER: ${SV_SERVER:-https://app.streamvessel.com}
      SV_CLIENT_ID: ${SV_CLIENT_ID:?set SV_CLIENT_ID}
      SV_CLIENT_SECRET_FILE: /run/secrets/sv_client_secret
      SV_INSTANCE: web-1   # one folder per host or service; keep it stable across deploys
    secrets: [sv_client_secret]
    volumes:
      - nginx-logs:/var/log/nginx:ro
      # Read offsets and the persistent queue. Without it a restart re-reads
      # or skips lines and drops queued batches.
      - sv-state:/var/lib/sv-log-agent

secrets:
  sv_client_secret:
    file: ./sv_client_secret.txt

volumes:
  nginx-logs:
  sv-state:
