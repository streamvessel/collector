name: agent

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - cloudflare-worker/**
      - .github/workflows/cloudflare-worker.yml
  pull_request:
    paths-ignore:
      - cloudflare-worker/**
      - .github/workflows/cloudflare-worker.yml

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10" # keep in step with the Makefile and Dockerfiles

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: exporter/svexporter
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: test/e2e/fakesvbe

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Generated distribution matches builder-config.yaml
        run: make check-generated
      - name: Build twice and compare (reproducible)
        # The checksum lives outside the checkout: an untracked file would set
        # vcs.modified in the second binary and change its hash.
        run: |
          make build && sha256sum bin/sv-log-agent | tee "$RUNNER_TEMP/first.sha"
          go clean -cache && make build && sha256sum -c "$RUNNER_TEMP/first.sha"
      - name: Example config validates
        run: |
          echo placeholder > "$RUNNER_TEMP/secret"
          SV_SERVER=https://sv.example SV_CLIENT_ID=sva_ci SV_CLIENT_SECRET_FILE="$RUNNER_TEMP/secret" \
            SV_STORAGE_DIR="$RUNNER_TEMP/state" bin/sv-log-agent validate --config examples/agent.yaml
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - name: Kill mid-batch and sv-be outage in the Compose stack
        run: test/e2e/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
